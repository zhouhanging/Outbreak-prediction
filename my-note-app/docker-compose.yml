version: '3.8'

services:
  # AI 笔记助手应用
  note-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-note-app
    restart: unless-stopped
    ports:
      - "9222:9222"  # Electron 远程调试端口
      - "5173:5173"  # Vite 开发服务器端口（仅开发模式）
    volumes:
      # 持久化数据卷
      - note-app-data:/app/data
      # 挂载笔记目录（可选，用于本地访问）
      - ./data:/app/data:ro
    environment:
      - NODE_ENV=production
      - ELECTRON_ENABLE_LOGGING=true
      # Ollama 连接配置
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - note-app-network
    depends_on:
      - ollama
      - chromadb

  # Ollama 本地 AI 服务
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # 持久化模型数据
      - ollama-data:/root/.ollama
    # GPU 支持（如果有）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - note-app-network

  # ChromaDB 向量数据库
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/app/.chroma
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - note-app-network

volumes:
  # 笔记数据持久化
  note-app-data:
    driver: local
  # Ollama 模型持久化
  ollama-data:
    driver: local
  # ChromaDB 数据持久化
  chroma-data:
    driver: local

networks:
  note-app-network:
    driver: bridge
